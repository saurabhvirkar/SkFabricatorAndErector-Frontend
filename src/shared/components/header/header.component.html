<header class="bg-white shadow-lg fixed top-0 left-0 right-0 z-50 transition-all duration-300"
        [class.scrolled]="isScrolled">
  <!-- Top Bar for Contact Info and Social Media -->
  <div class="top-bar bg-gray-800 text-white text-xs py-1.5 hidden md:block" [class.hidden]="isScrolled">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center min-h-[2rem]">
      <!-- Contact Info -->
      <div class="flex items-center space-x-4 text-xs">
        <a href="tel:+919552034884" class="flex items-center hover:text-blue-400 transition-colors duration-200" aria-label="Call SK Fabricator & Erector">
          <svg class="h-3.5 w-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
          <span>+91 95520 34884</span>
        </a>
        <a href="mailto:info@skfabricator.com" class="flex items-center hover:text-blue-400 transition-colors duration-200" aria-label="Email SK Fabricator & Erector">
          <svg class="h-3.5 w-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-18 4v7a2 2 0 002 2h14a2 2 0 002-2v-7m-18 0L21 8"></path></svg>
          <span>info&#64;skfabricator.com</span>
        </a>
      </div>
      <!-- Social Media Icons -->
      <div class="flex items-center space-x-3">
        <a href="https://www.facebook.com/skfabricator" target="_blank" rel="noopener noreferrer" aria-label="Facebook" class="hover:text-blue-400 transition-colors duration-200">
          <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.776-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clip-rule="evenodd" /></svg>
        </a>
        <a href="https://twitter.com/skfabricator" target="_blank" rel="noopener noreferrer" aria-label="Twitter" class="hover:text-blue-400 transition-colors duration-200">
          <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.007-.532A8.318 8.318 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 014 9.74c-.095 0-.187.007-.275.02v.058a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84" /></svg>
        </a>
        <a href="https://www.linkedin.com/company/skfabricator" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="hover:text-blue-400 transition-colors duration-200">
          <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd" /></svg>
        </a>
      </div>
    </div>
  </div>
  <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between min-h-[4rem] py-1.5">
      <a routerLink="/" class="flex items-center gap-x-2.5 logo-container" aria-label="SK Fabricator & Erector Home">
        <div class="bg-blue-600 text-white font-black text-xl w-9 h-9 flex items-center justify-center rounded-full shadow-md transition-all duration-300 hover:bg-blue-700 logo-icon shrink-0">
          SK
        </div>
        <div class="hidden sm:flex flex-col leading-tight logo-text-group">
          <span class="text-base font-bold text-gray-800 logo-text-main">
            Fabricator & Erector
          </span>
          <span class="text-[10px] text-blue-600 font-medium tracking-wide logo-text-sub">
            Perfection Through Precision
          </span>
        </div>
      </a>

      <div class="hidden md:flex items-center space-x-1 lg:space-x-2 flex-wrap">
        @for (item of navItems; track item.link) {
          <a [routerLink]="item.link" routerLinkActive="text-blue-600 border-b-2 border-blue-600 font-semibold"
             [routerLinkActiveOptions]="{exact: item.link === '/'}"
             class="px-2.5 py-1.5 rounded-md text-xs font-semibold text-gray-700 hover:text-blue-600 transition-colors duration-200">
            {{ item.label }}
          </a>
        }
      </div>

      <div class="md:hidden flex items-center">
        <button (click)="toggleMenu()" type="button"
                class="inline-flex items-center justify-center p-2 rounded-md text-gray-700 hover:text-blue-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-600"
                aria-controls="mobile-menu" [attr.aria-expanded]="isMenuOpen" aria-label="Toggle navigation menu">
          <svg *ngIf="!isMenuOpen" class="block h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
          <svg *ngIf="isMenuOpen" class="block h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="md:hidden bg-white border-t border-gray-200 mobile-menu" [class.open]="isMenuOpen" id="mobile-menu">
    <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
      @for (item of navItems; track item.link) {
        <a [routerLink]="item.link" routerLinkActive="bg-blue-50 text-blue-600 font-semibold" (click)="toggleMenu()"
           class="block px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-blue-600">
          {{ item.label }}
        </a>
      }
    </div>
  </div>
</header>
