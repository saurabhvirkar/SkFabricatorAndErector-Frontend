<div class="min-h-screen flex flex-col relative">

  <!-- ════════════════════════════════════════════════════
       BEAUTIFUL BRANDED PAGE TRANSITION OVERLAY
       Shows a frosted-glass center card with dual-ring
       spinner + SK logo mark during every route change.
       ════════════════════════════════════════════════════ -->
  @if (routeLoadingService.isLoading()) {
    <div class="nav-loader-overlay" aria-live="polite" aria-label="Loading page…" role="status">

      <!-- Top progress bar with glowing dot -->
      <div class="nav-loader-topbar">
        <div class="nav-loader-topbar-glow"></div>
      </div>

      <!-- Center branded spinner card -->
      <div class="nav-loader-card">
        <!-- Dual-ring spinner -->
        <div class="nav-spinner">
          <div class="nav-spinner-ring nav-spinner-ring--outer"></div>
          <div class="nav-spinner-ring nav-spinner-ring--inner"></div>
          <!-- SK Brand mark in centre -->
          <div class="nav-spinner-brand">SK</div>
        </div>
        <p class="nav-loader-label">Loading…</p>
      </div>

    </div>
  }

  <!-- Public Header (Rendered only on non-admin routes) -->
  @if (!isAdminRoute()) {
    <app-header></app-header>
  }

  <!-- Main Content Area with Router Outlet & Smooth Page Transition -->
  <main class="flex-grow">
    <div [attr.data-route]="currentUrl()" class="page-transition-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Public Footer (Rendered only on non-admin routes) -->
  @if (!isAdminRoute()) {
    <app-footer></app-footer>
  }
</div>
