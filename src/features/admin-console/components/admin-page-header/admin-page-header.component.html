<div class="bg-white p-3 rounded-3 border shadow-sm d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2.5 mb-3">
  <div class="d-flex flex-column gap-0.5">
    <!-- Breadcrumb trail -->
    <nav class="d-flex align-items-center gap-1.5 text-xs text-secondary fw-medium">
      <a routerLink="/ops/adminportal/dashboard" class="text-decoration-none text-secondary hover-primary d-inline-flex align-items-center gap-1">
        <mat-icon class="fs-6 text-primary">admin_panel_settings</mat-icon>
        <span>Admin Console</span>
      </a>
      <span class="text-muted fw-bold">/</span>
      <span class="text-dark fw-semibold">{{ breadcrumb }}</span>
    </nav>

    <!-- Page Title & Icon -->
    <div class="d-flex align-items-center gap-2.5 pt-0.5">
      <div class="rounded-2 bg-primary-subtle text-primary d-inline-flex align-items-center justify-center p-1.5 border border-primary-subtle shrink-0" style="width: 34px; height: 34px;">
        <mat-icon class="fs-5">{{ icon }}</mat-icon>
      </div>
      <div>
        <h1 class="h5 font-bold text-dark mb-0 tracking-tight leading-tight">{{ title }}</h1>
        <p *ngIf="description" class="text-xs text-secondary mb-0 mt-0.5">{{ description }}</p>
      </div>
    </div>
  </div>

  <!-- Primary Action Button -->
  <div *ngIf="primaryActionLabel" class="d-flex align-items-center gap-2 align-self-start align-self-sm-center shrink-0">
    <button
      type="button"
      class="btn btn-primary btn-sm rounded-3 px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5 shadow-sm"
      (click)="onPrimaryClick()"
    >
      <mat-icon class="fs-6 flex-shrink-0 leading-none">{{ primaryActionIcon }}</mat-icon>
      <span>{{ primaryActionLabel }}</span>
    </button>
  </div>
</div>
