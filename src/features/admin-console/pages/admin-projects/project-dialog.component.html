<div class="modal-header border-bottom">
  <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2">
    <mat-icon class="text-primary">{{ isEdit ? 'edit' : 'add' }}</mat-icon>
    <span>{{ isEdit ? 'Edit Project' : 'Add New Project' }}</span>
  </h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="onCancel()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="modal-body py-3" style="max-height: 75vh; overflow-y: auto;">
    <!-- Title -->
    <div class="mb-3">
      <label for="projectTitle" class="form-label fw-semibold small text-secondary">Project Title <span class="text-danger">*</span></label>
      <input
        id="projectTitle"
        type="text"
        formControlName="title"
        placeholder="e.g. Industrial Structural Piping"
        class="form-control"
        [class.is-invalid]="form.get('title')?.touched && form.get('title')?.invalid"
      />
      <div class="invalid-feedback" *ngIf="form.get('title')?.hasError('required')">Project title is required</div>
      <div class="invalid-feedback" *ngIf="form.get('title')?.hasError('minlength')">Title must be at least 2 characters</div>
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label for="projectCategory" class="form-label fw-semibold small text-secondary">Category <span class="text-danger">*</span></label>
      <select
        id="projectCategory"
        formControlName="category"
        class="form-select"
        [class.is-invalid]="form.get('category')?.touched && form.get('category')?.invalid"
      >
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
      <div class="invalid-feedback" *ngIf="form.get('category')?.hasError('required')">Category is required</div>
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label for="projectDescription" class="form-label fw-semibold small text-secondary">Description</label>
      <textarea
        id="projectDescription"
        formControlName="description"
        rows="3"
        placeholder="Enter project description..."
        class="form-control"
      ></textarea>
    </div>

    <!-- Image Upload -->
    <div class="mb-3">
      <label for="projectImage" class="form-label fw-semibold small text-secondary">
        Project Image {{ isEdit ? '(Leave blank to keep existing image)' : '*' }}
      </label>
      <div class="d-flex align-items-center gap-2">
        <input
          id="projectImage"
          type="file"
          accept="image/*"
          (change)="onFileSelected($event)"
          class="form-control form-control-sm"
        />
        <button *ngIf="selectedFile" type="button" class="btn btn-outline-danger btn-sm" (click)="clearFile()" title="Clear selected file">
          <mat-icon class="fs-6 align-middle">close</mat-icon>
        </button>
      </div>
      <div *ngIf="previewUrl()" class="mt-3">
        <span class="form-text d-block mb-1">Image Preview:</span>
        <img [src]="previewUrl()" alt="Preview" class="img-thumbnail rounded-3 shadow-sm" style="max-height: 120px; object-fit: cover;" />
      </div>
    </div>
  </div>

  <div class="modal-footer border-top pt-2 gap-2">
    <button type="button" class="btn btn-light rounded-3 px-3" (click)="onCancel()" [disabled]="isSubmitting()">Cancel</button>
    <button type="submit" class="btn btn-primary rounded-3 px-4" [disabled]="form.invalid || (!isEdit && !selectedFile) || isSubmitting()">
      <span *ngIf="!isSubmitting()" class="d-inline-flex align-items-center gap-1.5">
        <mat-icon class="fs-6">{{ isEdit ? 'save' : 'add' }}</mat-icon>
        {{ isEdit ? 'Save Changes' : 'Create Project' }}
      </span>
      <span *ngIf="isSubmitting()" class="d-inline-flex align-items-center gap-1.5">
        <mat-icon class="fs-6 animate-spin">refresh</mat-icon> Saving...
      </span>
    </button>
  </div>
</form>
