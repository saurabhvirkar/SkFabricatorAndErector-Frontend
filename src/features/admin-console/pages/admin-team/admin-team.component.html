<div class="d-flex flex-column gap-4">
  <!-- Shared Page Header -->
  <app-admin-page-header
    title="Team Members Management"
    breadcrumb="Team"
    icon="groups"
    description="Manage SK Fabricator & Erector leadership and engineering staff profiles."
    primaryActionLabel="Add Team Member"
    primaryActionIcon="add"
    (primaryAction)="openAddDialog()"
  ></app-admin-page-header>

  <!-- Search & Filters Bar -->
  <div class="bg-white p-3 rounded-4 border shadow-sm d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center justify-between gap-3">
    <div class="position-relative w-100 style-search-box" style="max-width: 320px;">
      <mat-icon class="position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary fs-5 pointer-events-none">search</mat-icon>
      <input
        type="text"
        [value]="filterText()"
        (input)="applyFilter($event)"
        placeholder="Search team members..."
        aria-label="Search team members"
        class="form-control form-control-sm ps-5 bg-light rounded-3"
      />
    </div>
    <span class="small text-secondary fw-medium align-self-end align-self-sm-center">
      Showing <strong class="text-dark">{{ filteredTeam().length }}</strong> team profiles
    </span>
  </div>

  <!-- Loading State -->
  <div class="bg-white p-4 rounded-4 border shadow-sm" *ngIf="isLoading()">
    <app-loading-state message="Loading team member profiles..."></app-loading-state>
  </div>

  <!-- Error State -->
  <div class="bg-white p-4 rounded-4 border shadow-sm" *ngIf="hasError() && !isLoading()">
    <app-error-state
      title="Failed to load team members"
      description="An error occurred while retrieving team profiles."
      (retry)="loadTeam()"
    ></app-error-state>
  </div>

  <!-- Table Card Shell -->
  <div *ngIf="!isLoading() && !hasError()" class="bg-white rounded-4 border shadow-sm overflow-hidden">
    <app-empty-state
      *ngIf="filteredTeam().length === 0"
      icon="groups"
      title="No team members found"
      description="Click 'Add Team Member' to create a team profile."
      actionLabel="Add Team Member"
      (action)="openAddDialog()"
    ></app-empty-state>

    <div *ngIf="filteredTeam().length > 0" class="table-responsive">
      <table class="table table-hover table-striped align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small" style="width: 70px;">Photo</th>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small user-select-none cursor-pointer" (click)="onSort('name')">
              <div class="d-flex align-items-center gap-1">
                <span>Name</span>
                <mat-icon class="fs-6 text-primary" *ngIf="sortColumn() === 'name'">{{ sortDirection() === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
              </div>
            </th>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small user-select-none cursor-pointer" (click)="onSort('role')">
              <div class="d-flex align-items-center gap-1">
                <span>Role</span>
                <mat-icon class="fs-6 text-primary" *ngIf="sortColumn() === 'role'">{{ sortDirection() === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
              </div>
            </th>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small">Email</th>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small text-end" style="width: 100px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let member of paginatedTeam()">
            <td class="py-2 px-3">
              <img [src]="member.imageUrl || 'assets/images/placeholder.jpg'" alt="Member" class="rounded-circle border" style="width: 36px; height: 36px; object-fit: cover;" />
            </td>
            <td class="py-2 px-3 fw-semibold text-dark">{{ member.name }}</td>
            <td class="py-2 px-3">
              <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2.5 py-1">
                {{ member.role }}
              </span>
            </td>
            <td class="py-2 px-3 text-secondary small">{{ member.email || 'N/A' }}</td>
            <td class="py-2 px-3 text-end">
              <div class="btn-group btn-group-sm">
                <button type="button" class="btn btn-outline-primary" (click)="openEditDialog(member)" title="Edit team member" aria-label="Edit team member">
                  <mat-icon class="fs-6 align-middle">edit</mat-icon>
                </button>
                <button type="button" class="btn btn-outline-danger" (click)="deleteTeamMember(member)" title="Delete team member" aria-label="Delete team member">
                  <mat-icon class="fs-6 align-middle">delete_outline</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Shared Bootstrap Paginator -->
    <app-admin-paginator
      *ngIf="filteredTeam().length > 0"
      [page]="page()"
      (pageChange)="page.set($event)"
      [pageSize]="pageSize()"
      (pageSizeChange)="pageSize.set($event)"
      [collectionSize]="filteredTeam().length"
    ></app-admin-paginator>
  </div>
</div>
