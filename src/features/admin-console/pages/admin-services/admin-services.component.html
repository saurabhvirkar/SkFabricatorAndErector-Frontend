<div class="d-flex flex-column gap-4">
  <!-- Shared Page Header -->
  <app-admin-page-header
    title="Services Management"
    breadcrumb="Services"
    icon="design_services"
    description="Manage SK Fabricator & Erector core service offerings and detailed solutions."
    primaryActionLabel="Add Service"
    primaryActionIcon="add"
    (primaryAction)="openAddDialog()"
  ></app-admin-page-header>

  <!-- Search & Filters Bar -->
  <div class="bg-white p-3 rounded-4 border shadow-sm d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center justify-between gap-3">
    <div class="position-relative w-100 style-search-box" style="max-width: 320px;">
      <mat-icon class="position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary fs-5 pointer-events-none">search</mat-icon>
      <input
        type="text"
        [value]="filterText()"
        (input)="applyFilter($event)"
        placeholder="Search services..."
        aria-label="Search services"
        class="form-control form-control-sm ps-5 bg-light rounded-3"
      />
    </div>
    <span class="small text-secondary fw-medium align-self-end align-self-sm-center">
      Showing <strong class="text-dark">{{ filteredServices().length }}</strong> service records
    </span>
  </div>

  <!-- Loading State -->
  <div class="bg-white p-4 rounded-4 border shadow-sm" *ngIf="isLoading()">
    <app-loading-state message="Loading service catalog..."></app-loading-state>
  </div>

  <!-- Error State -->
  <div class="bg-white p-4 rounded-4 border shadow-sm" *ngIf="hasError() && !isLoading()">
    <app-error-state
      title="Failed to load services"
      description="An error occurred while retrieving service offerings."
      (retry)="loadServices()"
    ></app-error-state>
  </div>

  <!-- Table Card Shell -->
  <div *ngIf="!isLoading() && !hasError()" class="bg-white rounded-4 border shadow-sm overflow-hidden">
    <app-empty-state
      *ngIf="filteredServices().length === 0"
      icon="design_services"
      title="No services found"
      description="Click 'Add Service' to create a service item."
      actionLabel="Add Service"
      (action)="openAddDialog()"
    ></app-empty-state>

    <div *ngIf="filteredServices().length > 0" class="table-responsive">
      <table class="table table-hover table-striped align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small" style="width: 80px;">Image</th>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small user-select-none cursor-pointer" (click)="onSort('name')">
              <div class="d-flex align-items-center gap-1">
                <span>Name</span>
                <mat-icon class="fs-6 text-primary" *ngIf="sortColumn() === 'name'">{{ sortDirection() === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
              </div>
            </th>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small">Summary</th>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small">Description</th>
            <th scope="col" class="py-3 px-3 fw-bold text-secondary text-uppercase small text-end" style="width: 100px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let service of paginatedServices()">
            <td class="py-2 px-3">
              <img [src]="service.imageUrl || 'assets/images/placeholder.jpg'" alt="Service" class="rounded-2 border" style="width: 48px; height: 36px; object-fit: cover;" />
            </td>
            <td class="py-2 px-3 fw-semibold text-dark">{{ service.name }}</td>
            <td class="py-2 px-3 text-secondary small text-truncate" style="max-width: 200px;" [title]="service.summary || ''">
              {{ service.summary || 'N/A' }}
            </td>
            <td class="py-2 px-3 text-secondary small text-truncate" style="max-width: 250px;" [title]="service.description || ''">
              {{ service.description || 'N/A' }}
            </td>
            <td class="py-2 px-3 text-end">
              <div class="btn-group btn-group-sm">
                <button type="button" class="btn btn-outline-primary" (click)="openEditDialog(service)" title="Edit service" aria-label="Edit service">
                  <mat-icon class="fs-6 align-middle">edit</mat-icon>
                </button>
                <button type="button" class="btn btn-outline-danger" (click)="deleteService(service)" title="Delete service" aria-label="Delete service">
                  <mat-icon class="fs-6 align-middle">delete_outline</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Shared Bootstrap Paginator -->
    <app-admin-paginator
      *ngIf="filteredServices().length > 0"
      [page]="page()"
      (pageChange)="page.set($event)"
      [pageSize]="pageSize()"
      (pageSizeChange)="pageSize.set($event)"
      [collectionSize]="filteredServices().length"
    ></app-admin-paginator>
  </div>
</div>
