<div class="d-flex flex-column gap-2.5">
  <!-- Shared Page Header -->
  <app-admin-page-header
    title="Home Sliders Management"
    breadcrumb="Home Sliders"
    icon="view_carousel"
    description="Manage landing page hero slider images, titles, and descriptions."
    primaryActionLabel="Add Home Slider"
    primaryActionIcon="add"
    (primaryAction)="openAddDialog()"
  ></app-admin-page-header>

  <!-- Loading State -->
  <div class="bg-white p-3 rounded-3 border shadow-sm" *ngIf="isLoading()">
    <app-loading-state message="Loading home sliders..."></app-loading-state>
  </div>

  <!-- Error State -->
  <div class="bg-white p-3 rounded-3 border shadow-sm" *ngIf="hasError() && !isLoading()">
    <app-error-state
      title="Failed to load home sliders"
      description="An error occurred while retrieving hero slider items."
      (retry)="loadSliders()"
    ></app-error-state>
  </div>

  <!-- Table Card Shell -->
  <div *ngIf="!isLoading() && !hasError()" class="bg-white rounded-3 border shadow-sm overflow-hidden">
    <app-empty-state
      *ngIf="filteredSliders().length === 0"
      icon="view_carousel"
      title="No home sliders found"
      description="Click 'Add Home Slider' to upload a hero slider image and tagline."
      actionLabel="Add Home Slider"
      (action)="openAddDialog()"
    ></app-empty-state>

    <div *ngIf="filteredSliders().length > 0" class="table-responsive">
      <table class="table table-hover table-striped align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col" class="py-2.5 px-3 fw-bold text-secondary text-uppercase text-xs" style="width: 120px;">Image Preview</th>
            <th scope="col" class="py-2.5 px-3 fw-bold text-secondary text-uppercase text-xs user-select-none cursor-pointer" (click)="onSort('title')">
              <div class="d-flex align-items-center gap-1">
                <span>Title</span>
                <mat-icon class="fs-6 text-primary" *ngIf="sortColumn() === 'title'">{{ sortDirection() === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
              </div>
            </th>
            <th scope="col" class="py-2.5 px-3 fw-bold text-secondary text-uppercase text-xs">Description</th>
            <th scope="col" class="py-2.5 px-3 fw-bold text-secondary text-uppercase text-xs text-end" style="width: 80px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let slider of paginatedSliders()">
            <td class="py-2 px-3">
              <img [src]="slider.imageUrl || 'assets/images/placeholder.jpg'" alt="Slider" loading="lazy" class="rounded-2 border" style="width: 80px; height: 48px; object-fit: cover;" />
            </td>
            <td class="py-2 px-3 fw-semibold text-dark text-sm">{{ slider.title }}</td>
            <td class="py-2 px-3 text-secondary text-xs text-truncate" style="max-width: 300px;" [title]="slider.description || ''">
              {{ slider.description || 'N/A' }}
            </td>
            <td class="py-2 px-3 text-end">
              <button type="button" class="btn btn-outline-danger btn-sm" (click)="deleteSlider(slider)" title="Delete slider" aria-label="Delete slider">
                <mat-icon class="fs-6 align-middle">delete_outline</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Shared Bootstrap Paginator -->
    <app-admin-paginator
      *ngIf="filteredSliders().length > 0"
      [page]="page()"
      (pageChange)="page.set($event)"
      [pageSize]="pageSize()"
      (pageSizeChange)="pageSize.set($event)"
      [pageSizeOptions]="[5, 10, 15]"
      [collectionSize]="filteredSliders().length"
    ></app-admin-paginator>
  </div>
</div>
