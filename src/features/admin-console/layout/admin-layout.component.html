<div class="min-h-screen bg-slate-50 flex flex-col font-sans">
  <!-- Top Header Bar -->
  <header class="bg-slate-900 text-white shadow-md z-30 sticky top-0 border-b border-slate-800">
    <div class="px-4 py-3 flex items-center justify-between min-h-[4rem]">
      <div class="flex items-center space-x-3">
        <button
          mat-icon-button
          class="text-slate-300 hover:text-white md:hidden"
          (click)="isMobileNavOpen.set(!isMobileNavOpen())"
          aria-label="Toggle navigation menu"
          matTooltip="Toggle Navigation"
        >
          <mat-icon>menu</mat-icon>
        </button>
        
        <a routerLink="/ops/adminportal/dashboard" class="flex items-center space-x-2.5 group" aria-label="SK Fabricator & Erector Admin Home">
          <app-logo variant="white" size="md" altText="SK Fabricator & Erector Admin Logo"></app-logo>
          <div class="flex flex-col">
            <span class="font-bold text-base leading-none tracking-tight text-white">SK Fabricator & Erector</span>
            <span class="text-[11px] text-blue-400 font-medium mt-0.5">Unified Admin Console</span>
          </div>
        </a>
      </div>

      <!-- User Info & Logout -->
      <div class="flex items-center space-x-3">
        <div class="hidden sm:flex flex-col text-right">
          <span class="text-[11px] text-slate-400 font-medium">Session User</span>
          <span class="text-xs font-semibold text-slate-200">{{ userRole() || 'Admin' }}</span>
        </div>
        
        <span class="hidden sm:inline-block px-2.5 py-0.5 text-xs font-semibold rounded-full bg-blue-900/80 text-blue-300 border border-blue-700/60">
          {{ userRole() || 'Admin' }}
        </span>

        <button
          mat-button
          color="warn"
          class="!rounded-xl text-xs font-semibold flex items-center gap-1.5 hover:bg-red-950/40 min-h-[2.5rem]"
          (click)="logout()"
          matTooltip="Sign out of Admin Console"
          aria-label="Logout"
        >
          <mat-icon class="text-sm">logout</mat-icon>
          <span class="hidden sm:inline">Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Shell Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Desktop Persistent Left Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800 text-slate-300 flex-shrink-0">
      <nav class="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto">
        <div class="px-3 pb-2 text-[11px] font-bold uppercase tracking-wider text-slate-500">Navigation Menu</div>
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="bg-blue-600 text-white font-semibold shadow-md shadow-blue-600/30 border-l-4 border-blue-300"
          class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm transition-all duration-150 hover:bg-slate-800 hover:text-white group min-h-[2.75rem]"
        >
          <mat-icon class="text-xl text-slate-400 group-hover:text-white">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </nav>
      
      <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center font-medium">
        SK Fabricator & Erector Console
      </div>
    </aside>

    <!-- Mobile Drawer Overlay Nav -->
    <div
      *ngIf="isMobileNavOpen()"
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 md:hidden"
      (click)="isMobileNavOpen.set(false)"
    ></div>
    <aside
      *ngIf="isMobileNavOpen()"
      class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-slate-300 z-50 flex flex-col md:hidden shadow-2xl animate-in slide-in-from-left duration-200 border-r border-slate-800"
    >
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <span class="font-bold text-white text-sm flex items-center gap-2">
          <mat-icon class="text-blue-500">menu_open</mat-icon> Admin Menu
        </span>
        <button mat-icon-button class="text-slate-400 hover:text-white" (click)="isMobileNavOpen.set(false)" matTooltip="Close Menu" aria-label="Close Menu">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="bg-blue-600 text-white font-semibold"
          (click)="isMobileNavOpen.set(false)"
          class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm transition-colors hover:bg-slate-800 hover:text-white min-h-[2.75rem]"
        >
          <mat-icon class="text-xl text-slate-400">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 bg-slate-100">
      <div class="max-w-7xl mx-auto space-y-6">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
