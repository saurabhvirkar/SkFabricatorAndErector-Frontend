name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [ develop, main ]

jobs:
  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Determine Environment & Build
        id: build_step
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Building Production configuration..."
            npm run build -- --configuration production
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "project_name=sk-fabricator" >> $GITHUB_OUTPUT
          else
            echo "Building QA configuration..."
            npm run build -- --configuration qa
            echo "environment=qa" >> $GITHUB_OUTPUT
            echo "project_name=sk-fabricator-qa" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ steps.build_step.outputs.project_name }}
          directory: dist/sk-fabricator-ui/browser
          gitBranch: ${{ github.ref_name }}
